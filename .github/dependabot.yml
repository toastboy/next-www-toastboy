version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "daily"
      # Hedge against supply-chain attacks by waiting for a version to prove
      # itself before proposing it — larger bumps carry more risk, so they
      # wait longer. Security updates are exempt from cooldown and always
      # land immediately regardless of these thresholds.
      cooldown:
          default-days: 7
          semver-patch-days: 3
          semver-minor-days: 7
          semver-major-days: 14
      # Majors are taken deliberately (e.g. with `ncu --target major`), not as
      # PRs: minor and patch updates, including security fixes, still flow.
      # This also keeps @types/node on the 24.x that matches the runtime.
      ignore:
          - dependency-name: "*"
            update-types:
                - "version-update:semver-major"
      groups:
          eslint-core:
              patterns:
                  - "eslint"
                  - "@eslint/js"
          eslint-plugins:
              patterns:
                  - "eslint-plugin-*"
          mantine:
              patterns:
                  - "@mantine/*"
          next:
              patterns:
                  - "next"
                  - "@next/eslint-plugin-next"
                  - "eslint-config-next"
          playwright:
              patterns:
                  - "@playwright/*"
          prisma:
              patterns:
                  - "prisma"
                  - "@prisma/adapter-mariadb"
                  - "@prisma/client"
          react-core:
              patterns:
                  - "react"
                  - "react-dom"
                  - "react-test-renderer"
          react-types:
              patterns:
                  - "@types/react"
                  - "@types/react-dom"
          sentry:
              patterns:
                  - "@sentry/*"
          storybook:
              patterns:
                  - "storybook"
                  - "@storybook/*"
                  - "eslint-plugin-storybook"
          tiptap:
              patterns:
                  - "@tiptap/*"
          typescript-eslint:
              patterns:
                  - "@typescript-eslint/*"
          vitest:
              patterns:
                  - "vitest"
                  - "@vitest/*"
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"
    - package-ecosystem: "terraform"
      directory: "/terraform"
      schedule:
          interval: "weekly"
    - package-ecosystem: "docker"
      directory: "/"
      schedule:
          interval: "weekly"
      # Stay on Node 24 (see .nvmrc and engines); a new Node major is a
      # deliberate change across the Dockerfile, .nvmrc, engines, @types/node
      # and the workflows' node-version.
      ignore:
          - dependency-name: "node"
            update-types:
                - "version-update:semver-major"

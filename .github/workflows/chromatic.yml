name: "Chromatic"

on:
    push:
        branches: [main]
    pull_request:

jobs:
    chromatic:
        name: Run Chromatic
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            - name: Install dependencies
              run: npm ci

            - name: Generate prisma client and zod schemas
              run: npm run generate

            - name: Run Chromatic
              uses: chromaui/action@latest
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
                  exitOnceUploaded: true
                  # Builds on main become the baseline automatically. Merges
                  # here are rebases, which Chromatic can't recognise as a PR
                  # merging, so without this main's baseline never advances
                  # and every later build is diffed against a stale one.
                  autoAcceptChanges: main

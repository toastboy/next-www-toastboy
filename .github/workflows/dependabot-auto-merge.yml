name: Dependabot Auto Merge

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

permissions:
    contents: write
    pull-requests: write

jobs:
    auto-merge:
        if: github.actor == 'dependabot[bot]'
        runs-on: ubuntu-latest
        steps:
            # Dependabot's cooldown config (.github/dependabot.yml) already
            # withholds proposing a version until it's cleared its minimum
            # age, so every PR here is already eligible — just enable
            # auto-merge and let required status checks gate the actual merge.
            # Rebase, not merge commit: the repo only permits rebase merges
            # (linear history, no merge commits — see repo merge settings).
            - name: Enable auto-merge
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh pr merge --auto --rebase "${{ github.event.pull_request.html_url }}"

name: Reviewdog
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    eslint:
        name: runner / eslint
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            checks: write

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - run: npm ci

            - run: npm run generate

            - name: Run ESLint with Reviewdog
              uses: reviewdog/action-eslint@3ee2a450da17e060b9dfa4bffd53976906c6b2b0 # v1
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  reporter: github-check
                  eslint_flags: "."
                  fail_level: error

    prettier:
        name: runner / prettier
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - run: npm ci

            - run: npm run format:check
